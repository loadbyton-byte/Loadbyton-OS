# Self-contained production-like stack: web + PostgreSQL in containers. For Neon/Supabase + Cloudflare on Oracle use docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lbt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: loadbyton
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lbt -d loadbyton"], interval: 5s, retries: 10 }
  web:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lbt:${DB_PASSWORD}@db:5432/loadbyton
      SESSION_SECRET: ${SESSION_SECRET:?min 32 chars}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:?set stripe and/or razorpay (mock is refused in production)}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:3000}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
    volumes: [files:/app/data/files]
volumes: { pgdata: {}, files: {} }
