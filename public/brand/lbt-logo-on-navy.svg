<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 120" width="8600" height="2319" role="img" aria-label="Loadbyton">
  <!-- Same lockup, white wordmark on a navy fill, for dark surfaces (nav,
       footer, hero). The divider bars stay Loadbyton Red either way. -->
  <rect width="445" height="120" fill="#0F2B3D" />
  <text x="20" y="80" font-family="sans-serif" font-weight="900" font-size="60" letter-spacing="4" fill="#FFFFFF">LOAD</text>
  <line x1="225" y1="30" x2="225" y2="90" stroke="#E53935" stroke-width="4" />
  <text x="247.5" y="55" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">B</text>
  <text x="247.5" y="85" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">Y</text>
  <line x1="270" y1="30" x2="270" y2="90" stroke="#E53935" stroke-width="4" />
  <text x="285" y="80" font-family="sans-serif" font-weight="900" font-size="60" letter-spacing="4" fill="#FFFFFF">TON</text>
</svg>
